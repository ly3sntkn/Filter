  <label class="ligne interrupteur">
    <span>Filtre activé</span>
    <input type="checkbox" id="actif" role="switch">

  </label>

  <p class="compteur"><strong id="compteur">0</strong> <span id="libelle-compteur">annonce masquée</span></p>

  <p class="diagnostic" id="diagnostic">Ouvrez une page de résultats Indeed.</p>

  <fieldset>
    <legend>Annonces d'écoles</legend>
    <label class="ligne"><input type="radio" name="mode" value="flou"> Flouter</label>
    <label class="ligne"><input type="radio" name="mode" value="masquer"> Masquer complètement</label>
  </fieldset>

  <footer>
    <a href="../../pages/confidentialite.html" target="_blank">Politique de confidentialité</a>
    <p class="note">Filtrage 100 % local. Aucune donnée de navigation n'est envoyée.</p>
  </footer>

  <script src="popup.js"></script>
